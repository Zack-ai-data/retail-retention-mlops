name: retail-retention-mlops

# Settings shared by the `app` and `quality` services
x-app-base: &app-base
  profiles: ["app"]
  depends_on:
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_healthy
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    MLFLOW_TRACKING_URI: http://mlflow:5000
    DATA_PATH: /data/online_retail_II.xlsx
    # scikit-learn's boosting would otherwise use every CPU core, which is slower (and
    # occasionally stalls) on small datasets like this one
    OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}

# Settings shared by the Airflow services (profile `airflow`; start with `docker compose up -d
# airflow-apiserver`). Airflow runs with the Celery executor: the scheduler queues tasks in Redis
# and the worker runs them. The pipeline is in the image, in its own Python environment.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: services/airflow/Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  image: retail-airflow:dev
  profiles: ["airflow"]
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # The database URLs are built from the POSTGRES_* variables, so the password stays in .env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: python /opt/airflow/db_url.py
    AIRFLOW__CELERY__RESULT_BACKEND_CMD: python /opt/airflow/db_url.py --celery
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # one machine, and training is heavy: two tasks at a time is plenty
    AIRFLOW__CELERY__WORKER_CONCURRENCY: "2"
    # what the pipeline tasks need (the same settings as the `app` service)
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    MLFLOW_TRACKING_URI: http://mlflow:5000
    DATA_PATH: /data/online_retail_II.xlsx
    OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
  volumes:
    - ./services/airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    - ./data:/data:ro
  depends_on: &airflow-depends
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: retail-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to localhost only; DBeaver connects to localhost:${POSTGRES_PORT}
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Experiment tracking and model registry. UI: http://localhost:5000
  # Metadata lives in the `mlflow` database on the postgres service; artifacts in a volume.
  mlflow:
    build:
      context: .
      dockerfile: services/mlflow/Dockerfile
    image: retail-mlflow:dev
    container_name: retail-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MLFLOW_DB: mlflow
      # The background job system (a job runner and several worker processes, about 230 MB each)
      # serves features this project does not use: tracking, the registry and artifacts do not
      # need it
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlartifacts:/mlartifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Pipeline runner. Not started by a plain `docker compose up`;
  # run it with: docker compose run --rm app
  app:
    <<: *app-base
    build:
      context: .
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: retail-app:dev
    volumes:
      - ./data:/data:ro

  # HTTP API (FastAPI). Start it with: docker compose up -d api   Docs: http://localhost:8000/docs
  # Bound to localhost only: there is no authentication. It needs the models in the registry
  # (train first) and, for stored scores and outreach plans, the score and plan stages.
  api:
    <<: *app-base
    build:
      context: .
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: retail-app:dev
    container_name: retail-api
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      # /health answers 503 when the models are not loaded or the database is down
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Dashboard (Streamlit). Start it with: docker compose up -d dashboard   http://localhost:8501
  # It only talks to the API, so it has none of the training stack. Localhost only.
  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
      target: runtime
    image: retail-dashboard:dev
    container_name: retail-dashboard
    profiles: ["app"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # The dashboard's own tests (they need Streamlit, which the quality image does not have, and
  # run without tests/conftest.py, which needs the database driver the dashboard does not have).
  # Run with: docker compose run --rm dashboard-tests
  dashboard-tests:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
      target: test
    image: retail-dashboard-test:dev
    profiles: ["app"]
    working_dir: /app
    volumes:
      - .:/app
    command: ["python", "-m", "pytest", "tests/test_dashboard_client.py", "tests/test_dashboard_ui.py", "-q", "-p", "no:cacheprovider", "--noconftest"]

  # Code quality gate: lint, format check, strict type check, then the tests with the coverage
  # threshold from pyproject.toml. Exits non-zero if anything fails.
  # Run it with: docker compose run --rm quality
  # The project folder is mounted, so it checks your current files without a rebuild.
  quality:
    <<: *app-base
    build:
      context: .
      target: dev
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: retail-app-quality:dev
    volumes:
      - .:/app
    command:
      - sh
      - -c
      - ruff check . && ruff format --check . && mypy && python -m pytest --cov -q

  # ----------------------------------------------------------------------------------- Airflow
  # Message broker for the Celery executor. Not published to the host.
  redis:
    # 7.2 is the last release under the original open-source licence (the same pin Airflow uses)
    image: redis:7.2-bookworm
    profiles: ["airflow"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Runs once: migrates Airflow's database and creates the admin user. It refuses to start without
  # the secrets in .env (see .env.example), so Airflow is never left running with default logins.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        missing=""
        for name in AIRFLOW__CORE__FERNET_KEY AIRFLOW__API_AUTH__JWT_SECRET _AIRFLOW_WWW_USER_PASSWORD; do
          if [ -z "$${!name}" ]; then missing="$$missing $$name"; fi
        done
        if [ -n "$$missing" ]; then
          echo "ERROR: these settings are empty:$$missing"
          echo "Set AIRFLOW_FERNET_KEY, AIRFLOW_JWT_SECRET and AIRFLOW_ADMIN_PASSWORD in .env (see .env.example)."
          exit 1
        fi
        mkdir -p /opt/airflow/logs
        chown -R "$${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        # The image's entrypoint migrates the database and creates the admin user because of the
        # _AIRFLOW_* settings below, but it carries on even when that fails. So check the result:
        # init must fail loudly, or every other service would start on a broken database.
        /entrypoint airflow version
        /entrypoint airflow db check || { echo "ERROR: Airflow cannot use its database."; exit 1; }
        /entrypoint airflow users list | grep -q " $${_AIRFLOW_WWW_USER_USERNAME} " \
          || { echo "ERROR: the admin user was not created."; exit 1; }
        echo "Airflow database and admin user are ready."
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    user: "0:0"

  # The web interface and API. http://localhost:8080
  airflow-apiserver:
    <<: *airflow-common
    container_name: retail-airflow-apiserver
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: retail-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: retail-airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # Runs the tasks, in the pipeline's own environment
  airflow-worker:
    <<: *airflow-common
    container_name: retail-airflow-worker
    command: celery worker
    healthcheck:
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    environment:
      <<: *airflow-env
      # lets the worker finish its tasks cleanly when it is stopped
      DUMB_INIT_SETSID: "0"
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: retail-airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------------------------------------
  # Monitoring (profile "monitoring", so a plain `up` does not start it).
  #   docker compose --profile monitoring up -d        Grafana http://localhost:3000
  # Prometheus scrapes the API's /metrics (start the API too: docker compose up -d api). Grafana
  # reads Postgres directly through a read-only role. Both are bound to localhost.
  # ------------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: retail-prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Creates (or updates) the read-only Postgres login Grafana uses, then exits. Postgres only runs
  # sql/init on a brand-new volume, so this is a repeatable step of its own. It refuses to run
  # without a password, and the password reaches the script through the environment, not a command
  # line.
  grafana-db-init:
    image: postgres:16
    profiles: ["monitoring"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      WAREHOUSE_DB: ${POSTGRES_DB}
    volumes:
      - ./services/grafana/db:/db:ro
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$$GRAFANA_DB_PASSWORD" ] || { echo "GRAFANA_DB_PASSWORD is empty: set it in .env (see .env.example)" >&2; exit 1; }
        exec psql -v ON_ERROR_STOP=1 -d postgres -f /db/readonly_user.sql
    restart: "no"

  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: retail-grafana
    profiles: ["monitoring"]
    depends_on:
      grafana-db-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    # Grafana's built-in login is admin/admin, so refuse to start without a password from .env
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "GRAFANA_ADMIN_PASSWORD is empty: set it in .env (see .env.example)" >&2; exit 1; }
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # used by services/grafana/provisioning/datasources/datasources.yml
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      # used by services/grafana/provisioning/alerting/contactpoints.yml; without a value alerts are
      # evaluated but cannot be delivered (the address below never resolves)
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-https://alert-webhook-not-set.invalid/}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana-dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  mlartifacts:
  airflow-logs:
  prometheus-data:
  grafana-data:
