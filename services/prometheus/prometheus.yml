# Prometheus: scrapes the API's /metrics (traffic, latency, the model versions being served).
# Everything else Grafana shows is read straight from Postgres, so there is nothing else to scrape.
# Started with: docker compose --profile monitoring up -d (the API must be running to be scraped:
# docker compose up -d api).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: retail-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
