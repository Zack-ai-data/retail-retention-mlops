# Continuous integration: the same checks as `docker compose run --rm quality`.
#
#   quality        every push and pull request: lint, format, strict types and the fast tests.
#                  Training tests use one hyperparameter combination and 100 bootstrap resamples
#                  (tests/conftest.py), so it takes minutes, not the 23 it took with the real
#                  settings. This, `dashboard` and `airflow-dags` are the checks a pull request must pass.
#   dashboard      the Streamlit dashboard's tests, from their own lock file.
#   airflow-dags   every push and pull request: builds the Airflow image and loads every DAG in it.
#                  A required check (see the job).
#   full-training  after a merge to main (and by hand): the same tests with the real
#                  hyperparameter grids and 1,000 resamples (FULL_TRAINING_TESTS=1).
#   regression     after a merge to main (and by hand): loads the real dataset and checks that
#                  the pinned results still reproduce.
#   fresh-machine  after a merge to main (and by hand): what a new machine does, from nothing.
#                  Starts the database, MLflow and the API on empty volumes, checks the API
#                  answers a clean 503 that says what to run, runs the whole pipeline, then
#                  checks the API serves a real customer without anyone reloading it.
#
# The last three do not run on pull requests, so they cannot be required checks. A red run on main
# means a change got through that the fast tests could not catch: fix it with a new pull request.
#
# Weekly: every job above also runs on a schedule, Mondays at 02:17 UTC (10:17 in Malaysia). Nothing
# in the repository has to change for it to go red. What it can catch is what is NOT pinned: the
# Docker images (python, postgres, the Airflow tag), the runner image and the actions move on their
# own, while the Python libraries are locked by hash and cannot. It is a reproducibility check, not
# retraining: the dataset is static, so the results should come out the same every week. Know that:
#   * it runs on GitHub's machines with their own throwaway Postgres and MLflow (never your laptop's
#     stack), and nothing it produces outlives the run;
#   * GitHub switches scheduled workflows off after 60 days with no activity in the repository (re-
#     enable under Actions), and delays scheduled runs when it is busy, most of all at the start of
#     an hour: the first two runs, at :00, started 5 and 6.5 hours late, hence minute 17;
#   * it is free because this repository is public, and it uses no secret;
#   * a failed run emails whoever last changed the schedule line, if their GitHub notification
#     settings allow it (Settings > Notifications > Actions).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per kind of trigger and branch, and a newer run cancels an older one. The kind
# is part of the name so a push to main cannot cancel the weekly run (both use the main branch).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A throwaway PostgreSQL. The credentials exist only inside this job and protect nothing; no
    # real secret is used anywhere in this workflow.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: retail_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d retail_dw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci_admin
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: retail_dw
      OMP_NUM_THREADS: "4"
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # The exact, hash-checked versions the Docker images use, so CI and the local quality gate
      # run the same libraries (a test checks the installed versions match the lock file).
      - name: Install
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check (strict)
        run: mypy

      # The tests marked `warehouse` need the real dataset loaded into Postgres; the regression job
      # runs them. Everything else runs, including the end-to-end pipeline tests on a synthetic
      # workbook. The 90% branch-coverage minimum from pyproject.toml is enforced. The slowest
      # tests are listed so a slowdown is visible.
      - name: Tests with coverage
        run: python -m pytest --cov -m "not warehouse" --durations=15

  # The dashboard has its own dependencies (Streamlit), so its tests run from its own lock file.
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/dashboard/requirements-test.lock

      - name: Install
        run: pip install --require-hashes -r services/dashboard/requirements-test.lock

      - name: Dashboard tests
        run: python -m pytest tests/test_dashboard_client.py tests/test_dashboard_ui.py -q --noconftest

  # Builds the Airflow image and loads every DAG in it, the way Airflow does. A DAG with a mistake
  # (a typo in a stage name, a bad import) is silently left out of Airflow and only shows up as an
  # import error in its interface; here it fails the build. Nothing is published.
  #
  # A required check: the repository ruleset requires `quality`, `dashboard` and this job
  # before a pull request can merge.
  # The image is large, so its layers are cached: the slow step (the pipeline's libraries) only
  # rebuilds when requirements.lock changes.
  airflow-dags:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the Airflow image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/airflow/Dockerfile
          load: true
          push: false
          tags: retail-airflow:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,scope=airflow,mode=max

      - name: The pipeline's own environment starts
        run: docker run --rm retail-airflow:ci bash -c 'cd "$PIPELINE_HOME" && "$PIPELINE_PYTHON" -m src.main --help'

      - name: Load every DAG
        run: >-
          docker run --rm
          -v "$PWD/services/airflow/dags:/opt/airflow/dags:ro"
          -v "$PWD/services/airflow/check_dags.py:/check_dags.py:ro"
          retail-airflow:ci python /check_dags.py

  # The training tests again with the real hyperparameter grids and 1,000 bootstrap resamples.
  full-training:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # A throwaway PostgreSQL. The credentials exist only inside this job and protect nothing; no
    # real secret is used anywhere in this workflow.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: retail_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d retail_dw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci_admin
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: retail_dw
      OMP_NUM_THREADS: "4"
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # The exact, hash-checked versions the Docker images use, so CI and the local quality gate
      # run the same libraries (a test checks the installed versions match the lock file).
      - name: Install
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Tests with the real training settings
        env:
          FULL_TRAINING_TESTS: "1"
        run: python -m pytest -m "not warehouse" --durations=15

  # Loads the real 1M-row dataset (it is in the repository) and checks that the pinned results,
  # row counts and model metrics still reproduce on it.
  regression:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A throwaway PostgreSQL. The credentials exist only inside this job and protect nothing; no
    # real secret is used anywhere in this workflow.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: retail_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d retail_dw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci_admin
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: retail_dw
      OMP_NUM_THREADS: "4"
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # The exact, hash-checked versions the Docker images use, so CI and the local quality gate
      # run the same libraries (a test checks the installed versions match the lock file).
      - name: Install
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Load the dataset
        run: python -m src.main --stage load

      - name: Real-data regression tests
        run: python -m pytest -m warehouse --require-warehouse -q

  # What a new machine does, from nothing, with the project's own docker-compose.yml: the tests above
  # run on a database and a registry that already exist, so a step that only works because of what
  # the developer's machine already holds (data, models, tables) would never show there. Throwaway
  # credentials that exist only inside this job; no secret is used.
  fresh-machine:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      POSTGRES_USER: ci_admin
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: retail_dw

    steps:
      - uses: actions/checkout@v7

      # The API is left out of the wait: with no data it is meant to report itself as not ready
      - name: Build and start the database and MLflow on empty volumes
        run: docker compose up -d --build --wait postgres mlflow

      - name: Build and start the API
        run: docker compose up -d --build api

      # No tables, no models: the API must start, answer, and say what to run (a 503, never a 500)
      - name: With no data the API answers a clean 503 that says what to run
        run: |
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o health.json -w '%{http_code}' http://127.0.0.1:8000/health || true)
            [ "$code" = 503 ] && break
            sleep 2
          done
          echo "HTTP $code"; cat health.json; echo
          test "$code" = 503
          grep -q '"database":"not ready"' health.json
          grep -q 'python -m src.main --stage all' health.json

      - name: Load, build, train, score, plan and monitor from nothing
        run: docker compose run --rm app python -m src.main --stage all

      # Nobody calls /models/reload: the API fetches the models itself when asked about its health
      - name: The API picks the models up by itself and serves a real customer
        run: |
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o health.json -w '%{http_code}' http://127.0.0.1:8000/health || true)
            [ "$code" = 200 ] && break
            sleep 5
          done
          echo "HTTP $code"; cat health.json; echo
          test "$code" = 200
          grep -q '"models_loaded":true' health.json
          grep -q '"database":"ok"' health.json
          curl -sf http://127.0.0.1:8000/outreach/latest -o plan.json
          id=$(grep -o '"customer_id":[0-9]*' plan.json | head -1 | cut -d: -f2)
          echo "customer $id"
          test -n "$id"
          curl -sf "http://127.0.0.1:8000/customers/$id/score" > /dev/null
          curl -sf "http://127.0.0.1:8000/customers/$id/prediction" > /dev/null

      - name: Container logs, if anything failed
        if: failure()
        run: docker compose logs --no-color --tail 200 postgres mlflow api

      # --profile app: the API and the pipeline service belong to that profile, and a plain `down`
      # leaves any service whose profile is not switched on running
      - name: Tear down
        if: always()
        run: docker compose --profile app down -v
