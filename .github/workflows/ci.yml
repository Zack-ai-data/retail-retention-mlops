# Continuous integration: the same checks as `docker compose run --rm quality`.
#
#   quality        every push and pull request: lint, format, strict types and the fast tests.
#                  Training tests use one hyperparameter combination and 100 bootstrap resamples
#                  (tests/conftest.py), so it takes minutes, not the 23 it took with the real
#                  settings. This and `dashboard` are the checks a pull request must pass.
#   dashboard      the Streamlit dashboard's tests, from their own lock file.
#   airflow-dags   every push and pull request: builds the Airflow image and loads every DAG in it.
#                  Advisory: not a required check yet (see the job).
#   full-training  after a merge to main (and by hand): the same tests with the real
#                  hyperparameter grids and 1,000 resamples (FULL_TRAINING_TESTS=1).
#   regression     after a merge to main (and by hand): loads the real dataset and checks that
#                  the pinned results still reproduce.
#
# The last two do not run on pull requests, so they cannot be required checks. A red run on main
# means a change got through that the fast tests could not catch: fix it with a new pull request.
#
# Weekly: every job above also runs on a schedule, Mondays at 02:00 UTC (10:00 in Malaysia). Nothing
# in the repository has to change for it to go red. What it can catch is what is NOT pinned: the
# Docker images (python, postgres, the Airflow tag), the runner image and the actions move on their
# own, while the Python libraries are locked by hash and cannot. It is a reproducibility check, not
# retraining: the dataset is static, so the results should come out the same every week. Know that:
#   * it runs on GitHub's machines with their own throwaway Postgres and MLflow (never your laptop's
#     stack), and nothing it produces outlives the run;
#   * GitHub switches scheduled workflows off after 60 days with no activity in the repository (re-
#     enable under Actions), and may start a run several minutes late;
#   * it is free because this repository is public, and it uses no secret;
#   * a failed run emails whoever last changed the schedule line, if their GitHub notification
#     settings allow it (Settings > Notifications > Actions).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per kind of trigger and branch, and a newer run cancels an older one. The kind
# is part of the name so a push to main cannot cancel the weekly run (both use the main branch).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A throwaway PostgreSQL. The credentials exist only inside this job and protect nothing; no
    # real secret is used anywhere in this workflow.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: retail_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d retail_dw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci_admin
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: retail_dw
      OMP_NUM_THREADS: "4"
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # The exact, hash-checked versions the Docker images use, so CI and the local quality gate
      # run the same libraries (a test checks the installed versions match the lock file).
      - name: Install
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check (strict)
        run: mypy

      # The tests marked `warehouse` need the real dataset loaded into Postgres; the regression job
      # runs them. Everything else runs, including the end-to-end pipeline tests on a synthetic
      # workbook. The 90% branch-coverage minimum from pyproject.toml is enforced. The slowest
      # tests are listed so a slowdown is visible.
      - name: Tests with coverage
        run: python -m pytest --cov -m "not warehouse" --durations=15

  # The dashboard has its own dependencies (Streamlit), so its tests run from its own lock file.
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/dashboard/requirements-test.lock

      - name: Install
        run: pip install --require-hashes -r services/dashboard/requirements-test.lock

      - name: Dashboard tests
        run: python -m pytest tests/test_dashboard_client.py tests/test_dashboard_ui.py -q --noconftest

  # Builds the Airflow image and loads every DAG in it, the way Airflow does. A DAG with a mistake
  # (a typo in a stage name, a bad import) is silently left out of Airflow and only shows up as an
  # import error in its interface; here it fails the build. Nothing is published.
  #
  # Advisory for now: it is not one of the checks a pull request must pass (the repository
  # ruleset requires only `quality` and `dashboard`). Make it required once its timing is known.
  # The image is large, so its layers are cached: the slow step (the pipeline's libraries) only
  # rebuilds when requirements.lock changes.
  airflow-dags:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the Airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/airflow/Dockerfile
          load: true
          push: false
          tags: retail-airflow:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,scope=airflow,mode=max

      - name: The pipeline's own environment starts
        run: docker run --rm retail-airflow:ci bash -c 'cd "$PIPELINE_HOME" && "$PIPELINE_PYTHON" -m src.main --help'

      - name: Load every DAG
        run: >-
          docker run --rm
          -v "$PWD/services/airflow/dags:/opt/airflow/dags:ro"
          -v "$PWD/services/airflow/check_dags.py:/check_dags.py:ro"
          retail-airflow:ci python /check_dags.py

  # The training tests again with the real hyperparameter grids and 1,000 bootstrap resamples.
  full-training:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # A throwaway PostgreSQL. The credentials exist only inside this job and protect nothing; no
    # real secret is used anywhere in this workflow.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: retail_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d retail_dw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci_admin
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: retail_dw
      OMP_NUM_THREADS: "4"
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # The exact, hash-checked versions the Docker images use, so CI and the local quality gate
      # run the same libraries (a test checks the installed versions match the lock file).
      - name: Install
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Tests with the real training settings
        env:
          FULL_TRAINING_TESTS: "1"
        run: python -m pytest -m "not warehouse" --durations=15

  # Loads the real 1M-row dataset (it is in the repository) and checks that the pinned results,
  # row counts and model metrics still reproduce on it.
  regression:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A throwaway PostgreSQL. The credentials exist only inside this job and protect nothing; no
    # real secret is used anywhere in this workflow.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: retail_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d retail_dw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci_admin
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: retail_dw
      OMP_NUM_THREADS: "4"
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # The exact, hash-checked versions the Docker images use, so CI and the local quality gate
      # run the same libraries (a test checks the installed versions match the lock file).
      - name: Install
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Load the dataset
        run: python -m src.main --stage load

      - name: Real-data regression tests
        run: python -m pytest -m warehouse --require-warehouse -q
