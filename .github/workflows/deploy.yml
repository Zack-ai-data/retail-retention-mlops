# Release images: build the API and dashboard images, check they start, and publish them to the
# GitHub Container Registry (ghcr.io) under a version number.
#
# This is the "build and publish" half of delivery. It needs no server: running the published
# images somewhere (staging, then production) is a later step, once there is a host.
#
#   Release:  git tag -a v0.1.0 -m "..." && git push origin v0.1.0   (tag a commit on main)
#   Dry run:  Actions > Release images > Run workflow. It builds and checks both images but
#             publishes nothing unless you tick "Publish the images".
#
# Each image gets the version (0.1.0 and 0.1), the commit (sha-...), and `latest`. The API image
# is built with the commit as GIT_SHA, so training runs from that image record which code made them.
name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the images (otherwise build and check only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
            target: runtime
            check: "import src.api"
          - name: dashboard
            dockerfile: services/dashboard/Dockerfile
            target: runtime
            check: "import streamlit, src.dashboard_client"

    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}

    steps:
      - uses: actions/checkout@v4

      # ghcr.io names must be lowercase, and the repository name may not be
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Build into the local Docker, so the image can be checked before anything is published
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # The image must start, hold the libraries it needs, and not run as root
      - name: Check the image
        run: |
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm --entrypoint python "$image" -c "${{ matrix.check }}; print('imports ok')"
          user="$(docker run --rm --entrypoint id "$image" -un)"
          echo "runs as: $user"
          test "$user" = "app"

      # Same build again, from the cache, this time pushed
      - name: Publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }} image"
            echo "Published: ${PUBLISH}"
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
